<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SubhAadar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --hue: 270; --bg1: hsl(var(--hue), 80%, 12%); --bg2: hsl(calc(var(--hue) + 40), 80%, 18%); }
    html, body {
      width: 100%; height: 100%; overflow: hidden; touch-action: none;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      cursor: none; user-select: none; -webkit-user-select: none;
    }
    #title-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      text-align: center; padding: 8px 0 4px;
      background: rgba(0,0,0,0.35); backdrop-filter: blur(6px);
    }
    #title-bar h1 {
      font-size: clamp(1.4rem, 5vw, 2.5rem); letter-spacing: 4px;
      background: linear-gradient(90deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff,#ff6fcf,#ff6b6b);
      background-size: 300% auto; -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; background-clip: text;
      animation: shimmer 3s linear infinite;
    }
    #hint { font-size: clamp(0.65rem,2.5vw,0.85rem); color: rgba(255,255,255,0.55); margin-top:2px; letter-spacing:1px; }
    @keyframes shimmer { 0%{background-position:0% center} 100%{background-position:300% center} }
    #trail-canvas { position:fixed; inset:0; pointer-events:none; z-index:1; }
    #cursor {
      position:fixed; width:28px; height:28px; border-radius:50%;
      background:radial-gradient(circle,#fff 0%,rgba(255,255,255,0) 70%);
      box-shadow:0 0 12px 6px rgba(255,200,100,0.6);
      pointer-events:none; z-index:9998; transform:translate(-50%,-50%);
    }
    .popup { position:fixed; z-index:100; pointer-events:none; display:flex; align-items:center; justify-content:center; border-radius:50%; animation-fill-mode:both; will-change:transform,opacity; }
    .popup.letter { font-weight:900; animation:letterBurst 0.9s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes letterBurst { 0%{transform:scale(0.2) rotate(-20deg);opacity:1} 60%{transform:scale(1.15) rotate(5deg);opacity:1} 85%{transform:scale(1.0) rotate(-3deg);opacity:1} 100%{transform:scale(0.6) translateY(-80px) rotate(10deg);opacity:0} }
    .popup.emoji { animation:emojiBurst 1.1s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes emojiBurst { 0%{transform:scale(0) rotate(-30deg);opacity:1} 50%{transform:scale(1.4) rotate(15deg);opacity:1} 100%{transform:scale(0.5) translateY(-120px) rotate(-20deg);opacity:0} }
    .popup.photo { border:4px solid #fff; box-shadow:0 8px 32px rgba(0,0,0,0.5),0 0 0 6px rgba(255,255,255,0.15); overflow:hidden; animation:photoBurst 1.3s cubic-bezier(.22,1,.36,1) forwards; }
    .popup.photo img { width:100%; height:100%; object-fit:cover; }
    @keyframes photoBurst { 0%{transform:scale(0) rotate(-15deg);opacity:1} 55%{transform:scale(1.1) rotate(8deg);opacity:1} 80%{transform:scale(1.0) rotate(-3deg);opacity:1} 100%{transform:scale(0.7) translateY(-100px) rotate(12deg);opacity:0} }
    .ripple { position:fixed; border-radius:50%; pointer-events:none; z-index:50; animation:rippleOut 0.7s ease-out forwards; }
    @keyframes rippleOut { 0%{transform:scale(0);opacity:0.8} 100%{transform:scale(6);opacity:0} }
    .star { position:fixed; pointer-events:none; z-index:90; font-size:1.5rem; animation:starFly 1s ease-out forwards; }
    @keyframes starFly { 0%{transform:translate(0,0) scale(1);opacity:1} 100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0} }
    .fw-particle { position:fixed; width:8px; height:8px; border-radius:50%; pointer-events:none; z-index:200; animation:fwFly var(--dur) ease-out forwards; }
    @keyframes fwFly { 0%{transform:translate(0,0) scale(1);opacity:1} 100%{transform:translate(var(--fdx),var(--fdy)) scale(0);opacity:0} }
    #bg-shapes { position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
    .bg-shape { position:absolute; border-radius:50%; opacity:0.07; animation:floatShape linear infinite; }
    @keyframes floatShape { 0%{transform:translateY(110vh) rotate(0deg);opacity:0} 10%{opacity:0.07} 90%{opacity:0.07} 100%{transform:translateY(-20vh) rotate(720deg);opacity:0} }
    #score-board { position:fixed; bottom:16px; right:20px; z-index:9999; text-align:right; color:rgba(255,255,255,0.5); font-size:0.8rem; letter-spacing:1px; }
    #score-board span { font-size:1.4rem; font-weight:900; color:#ffd93d; text-shadow:0 0 10px rgba(255,217,61,0.6); }
    #milestone { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0); z-index:10000; text-align:center; pointer-events:none; transition:transform 0.4s cubic-bezier(.34,1.56,.64,1),opacity 0.4s; opacity:0; }
    #milestone .ms-text { font-size:clamp(2rem,10vw,5rem); font-weight:900; background:linear-gradient(90deg,#ffd93d,#ff6b6b,#6bcb77,#4d96ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    #milestone.show { transform:translate(-50%,-50%) scale(1); opacity:1; }
    #mobile-kb { display:none; position:fixed; bottom:0; left:0; right:0; z-index:9999; background:rgba(0,0,0,0.55); backdrop-filter:blur(8px); padding:8px 4px 12px; }
    .kb-row { display:flex; justify-content:center; gap:4px; margin-bottom:4px; }
    .kb-key { min-width:36px; height:44px; border-radius:8px; border:2px solid rgba(255,255,255,0.25); background:rgba(255,255,255,0.12); color:#fff; font-size:1rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 0.15s,transform 0.1s; -webkit-tap-highlight-color:transparent; user-select:none; flex:1; max-width:52px; }
    .kb-key:active { background:rgba(255,255,255,0.35); transform:scale(0.9); }
    @media (max-width:767px) { #mobile-kb { display:block; } body { padding-bottom:180px; } }
  </style>
</head>
<body>
<div id="bg-shapes"></div>
<canvas id="trail-canvas"></canvas>
<div id="cursor"></div>
<div id="title-bar">
  <h1>&#127775; SubhAadar &#127775;</h1>
  <div id="hint">Press any key &bull; Touch the screen &bull; Have fun! &#127881;</div>
</div>
<div id="score-board">Keys pressed: <span id="key-count">0</span></div>
<div id="milestone"><div class="ms-text" id="ms-text"></div></div>
<div id="mobile-kb">
  <div class="kb-row" id="kb-row-1"></div>
  <div class="kb-row" id="kb-row-2"></div>
  <div class="kb-row" id="kb-row-3"></div>
  <div class="kb-row" id="kb-row-4"></div>
</div>
<script>
var PHOTOS = [
  "photos/photo1.jpg",
  "photos/photo2.jpg",
  "photos/photo3.jpg"
];
var EMOJIS = ['rainbow','star2','tada','fireworks','butterfly','cherry_blossom','lollipop','balloon','rocket','unicorn','hatching_chick','sunflower','ribbon','trophy','dizzy','sparkles','musical_note','notes','fox','dog','cat','frog','lion','tiger','koala','panda','tulip','icecream','cupcake','carousel_horse','ferris_wheel','roller_coaster','circus_tent','performing_arts','art','dart','8ball','video_game','joystick'].map(function(n){return n;});
var EMOJI_CHARS = ['🌈','⭐','🎉','🎊','🦋','🌸','🍭','🎈','🚀','🦄','🐣','🌺','🎀','🏆','💫','🌟','🎵','🎶','🦊','🐶','🐱','🐸','🦁','🐯','🐨','🐼','🌻','🍦','🧁','🎠','🎡','🎢','🎪','🎭','🎨','🎯','🎱','🎮','🕹️','💝','🌙','☀️','⚡','🌊','🍀','🦚','🦜','🐬','🐙','🦋'];
var RAINBOW_COLORS = ['#FF6B6B','#FF8E53','#FFC300','#FFD93D','#6BCB77','#4D96FF','#C77DFF','#FF6FCF','#00D2FF','#43E97B'];
var MILESTONES = {10:'🎉 10 Keys!',25:'⭐ 25 Keys!',50:'🚀 50 Keys! Wow!',100:'🏆 100 Keys! Amazing!',200:'👑 200! Superstar!',500:'🌟 500! Legend! 🌟'};
var STAR_CHARS = ['⭐','✨','💫','🌟','★','✦','✧','✶'];

var keyCount = 0;
var lastX = window.innerWidth/2;
var lastY = window.innerHeight/2;
var trailPoints = [];

var canvas = document.getElementById('trail-canvas');
var ctx = canvas.getContext('2d');

function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function drawTrail(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  trailPoints = trailPoints.filter(function(p){return p.life > 0;});
  trailPoints.forEach(function(p){
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);
    ctx.fillStyle='hsla('+p.hue+',100%,60%,'+(p.life*0.4)+')';
    ctx.fill();
    p.life -= 0.04; p.r += 0.5;
  });
  requestAnimationFrame(drawTrail);
}
drawTrail();

var cursor = document.getElementById('cursor');
document.addEventListener('mousemove',function(e){
  lastX=e.clientX; lastY=e.clientY;
  cursor.style.left=lastX+'px'; cursor.style.top=lastY+'px';
  spawnTrail(lastX,lastY);
});

function spawnTrail(x,y){ trailPoints.push({x:x,y:y,r:4,hue:Math.random()*360,life:1}); }
function rand(a,b){ return Math.random()*(b-a)+a; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randColor(){ return pick(RAINBOW_COLORS); }

var bgShapes = document.getElementById('bg-shapes');
var SHAPE_COLORS=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff','#ff6fcf'];
function makeShape(){
  var el=document.createElement('div');
  el.className='bg-shape';
  var s=rand(30,120);
  el.style.cssText='width:'+s+'px;height:'+s+'px;left:'+rand(0,100)+'vw;bottom:-10%;background:'+pick(SHAPE_COLORS)+';animation-duration:'+rand(8,20)+'s;animation-delay:'+rand(0,15)+'s;';
  bgShapes.appendChild(el);
  setTimeout(function(){el.remove();},21000);
}
setInterval(makeShape,1000);
for(var i=0;i<6;i++) makeShape();

function spawnRipple(x,y,color){
  var el=document.createElement('div');
  el.className='ripple';
  var s=rand(40,80);
  el.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(x-s/2)+'px;top:'+(y-s/2)+'px;background:'+color+';opacity:0.5;';
  document.body.appendChild(el);
  setTimeout(function(){el.remove();},800);
}

function spawnStars(x,y,count){
  count=count||6;
  for(var i=0;i<count;i++){
    var el=document.createElement('div');
    el.className='star';
    var angle=(Math.PI*2*i)/count+rand(-0.3,0.3);
    var dist=rand(60,160);
    el.textContent=pick(STAR_CHARS);
    el.style.setProperty('--dx',Math.cos(angle)*dist+'px');
    el.style.setProperty('--dy',Math.sin(angle)*dist+'px');
    el.style.left=(x-12)+'px'; el.style.top=(y-12)+'px';
    el.style.animationDuration=rand(0.6,1.0)+'s';
    document.body.appendChild(el);
    setTimeout(function(){el.remove();},1100);
  }
}

function launchFirework(x,y){
  var count=Math.floor(rand(12,20));
  for(var i=0;i<count;i++){
    (function(i){
      var el=document.createElement('div');
      el.className='fw-particle';
      var angle=(Math.PI*2*i)/count;
      var dist=rand(80,200);
      var dur=rand(0.5,1.0);
      el.style.setProperty('--fdx',Math.cos(angle)*dist+'px');
      el.style.setProperty('--fdy',Math.sin(angle)*dist+'px');
      el.style.setProperty('--dur',dur+'s');
      el.style.left=x+'px'; el.style.top=y+'px';
      el.style.background=randColor();
      document.body.appendChild(el);
      setTimeout(function(){el.remove();},dur*1000+100);
    })(i);
  }
}

function spawnLetter(char,x,y){
  var el=document.createElement('div');
  el.className='popup letter';
  var size=Math.floor(rand(60,130));
  var color=randColor();
  el.textContent=char.toUpperCase();
  el.style.cssText='left:'+(x-size/2)+'px;top:'+(y-size/2)+'px;width:'+size+'px;height:'+size+'px;font-size:'+(size*0.72)+'px;color:'+color+';text-shadow:0 0 20px '+color+',0 4px 24px rgba(0,0,0,0.5);animation-duration:'+rand(0.7,1.1)+'s;';
  document.body.appendChild(el);
  setTimeout(function(){el.remove();},1200);
}

function spawnEmoji(x,y){
  var el=document.createElement('div');
  el.className='popup emoji';
  var size=Math.floor(rand(50,110));
  el.textContent=pick(EMOJI_CHARS);
  el.style.cssText='left:'+(x-size/2)+'px;top:'+(y-size/2)+'px;width:'+size+'px;height:'+size+'px;font-size:'+(size*0.75)+'px;animation-duration:'+rand(0.8,1.2)+'s;';
  document.body.appendChild(el);
  setTimeout(function(){el.remove();},1400);
}

var validPhotos = PHOTOS.filter(function(p){return p !== null && p !== undefined;});

function spawnPhoto(x,y){
  if(validPhotos.length===0){ spawnEmoji(x,y); return; }
  var el=document.createElement('div');
  el.className='popup photo';
  var size=Math.floor(rand(80,140));
  var src=pick(validPhotos);
  var img=document.createElement('img');
  img.src=src; img.alt='Shubhangi';
  img.onerror=function(){ el.remove(); spawnEmoji(x,y); };
  el.appendChild(img);
  el.style.cssText='left:'+(x-size/2)+'px;top:'+(y-size/2)+'px;width:'+size+'px;height:'+size+'px;border-color:'+randColor()+';animation-duration:'+rand(1.0,1.5)+'s;';
  document.body.appendChild(el);
  setTimeout(function(){el.remove();},1700);
}

var milestoneEl=document.getElementById('milestone');
var msTextEl=document.getElementById('ms-text');

function checkMilestone(){
  var msg=MILESTONES[keyCount];
  if(!msg) return;
  msTextEl.textContent=msg;
  milestoneEl.classList.add('show');
  for(var i=0;i<5;i++){
    (function(i){ setTimeout(function(){ launchFirework(rand(100,window.innerWidth-100),rand(100,window.innerHeight-100)); },i*200); })(i);
  }
  setTimeout(function(){milestoneEl.classList.remove('show');},2200);
}

function triggerEvent(char,x,y){
  var bar=80;
  var size=140;
  var px=Math.max(size/2+10,Math.min(window.innerWidth-size/2-10,x||lastX));
  var py=Math.max(size/2+bar,Math.min(window.innerHeight-size/2-10,y||lastY));

  keyCount++;
  document.getElementById('key-count').textContent=keyCount;

  for(var i=0;i<4;i++) spawnTrail(px+rand(-20,20),py+rand(-20,20));
  spawnRipple(px,py,randColor());

  var roll=Math.random();
  var isAlpha=/^[a-zA-Z0-9!@#%^&*()_+=\[\]{};',.<>?`~ -]$/.test(char||'');
  if(char && isAlpha){
    if(roll<0.45){ spawnLetter(char,px,py); }
    else if(roll<0.75){ spawnEmoji(px,py); spawnLetter(char,px+rand(-50,50),py+rand(-50,50)); }
    else{ spawnPhoto(px,py); spawnLetter(char,px+rand(-60,60),py+rand(-60,60)); }
  } else {
    spawnEmoji(px,py);
  }

  if(Math.random()<0.55) spawnStars(px,py,5);
  if(Math.random()<0.18) launchFirework(px,py);
  checkMilestone();
  document.documentElement.style.setProperty('--hue',Math.floor(Math.random()*360));
}

document.addEventListener('keydown',function(e){
  if(['F5','F11','F12'].includes(e.key)) return;
  if(e.ctrlKey||e.metaKey) return;
  e.preventDefault();
  var cx=window.innerWidth/2+rand(-window.innerWidth*0.25,window.innerWidth*0.25);
  var cy=window.innerHeight/2+rand(-window.innerHeight*0.20,window.innerHeight*0.20);
  var px=(lastX>50)?lastX+rand(-40,40):cx;
  var py=(lastY>100)?lastY+rand(-40,40):cy;
  triggerEvent(e.key.length===1?e.key:'*',px,py);
});

document.addEventListener('touchstart',function(e){
  e.preventDefault();
  Array.from(e.changedTouches).forEach(function(t){
    lastX=t.clientX; lastY=t.clientY;
    spawnTrail(lastX,lastY);
    var chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('');
    triggerEvent(pick(chars),lastX,lastY);
  });
},{passive:false});

document.addEventListener('touchmove',function(e){
  e.preventDefault();
  Array.from(e.changedTouches).forEach(function(t){ lastX=t.clientX; lastY=t.clientY; spawnTrail(lastX,lastY); });
},{passive:false});

document.addEventListener('click',function(e){
  lastX=e.clientX; lastY=e.clientY;
  var chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('');
  triggerEvent(pick(chars),lastX,lastY);
});

var KB_ROWS=[['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L'],['Z','X','C','V','B','N','M'],['1','2','3','4','5','6','7','8','9','0']];
KB_ROWS.forEach(function(row,ri){
  var rowEl=document.getElementById('kb-row-'+(ri+1));
  row.forEach(function(key){
    var btn=document.createElement('button');
    btn.className='kb-key';
    btn.textContent=key;
    btn.addEventListener('touchstart',function(e){
      e.preventDefault();
      var rect=btn.getBoundingClientRect();
      var kx=rect.left+rect.width/2;
      var ky=rect.top+rect.height/2;
      lastX=kx; lastY=ky;
      triggerEvent(key,kx,ky-rand(100,200));
    },{passive:false});
    rowEl.appendChild(btn);
  });
});

var idleTimer;
function resetIdle(){
  clearInterval(idleTimer);
  idleTimer=setInterval(function(){
    var x=rand(80,window.innerWidth-80);
    var y=rand(120,window.innerHeight-80);
    lastX=x; lastY=y;
    var chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    triggerEvent(pick(chars),x,y);
  },900);
}
['keydown','touchstart','click','mousemove'].forEach(function(ev){
  document.addEventListener(ev,function(){ clearInterval(idleTimer); setTimeout(resetIdle,4000); },{passive:true});
});
setTimeout(resetIdle,3000);

document.addEventListener('gesturestart',function(e){e.preventDefault();});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
</script>
</body>
</html>
