<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SubhAadar 🌟 Sensory Toy for Kids</title>
  <meta name="description" content="SubhAadar - Sensory keyboard and touch smash toy for babies and toddlers with animations, music, and family photos!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --tf-bg: #0b1d33;
      --tf-bg-deep: #060e1a;
      --tf-surface: rgba(18, 38, 66, 0.75);
      --tf-surface-border: rgba(255, 255, 255, 0.16);
      --tf-text: #ffffff;
      --tf-muted: #9bb3cc;
      --tf-accent: #ffb64f;
      --tf-accent-pink: #ff5e98;
      --tf-accent-cyan: #38ef7d;
      --tf-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
      --tf-font: 'Fredoka', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center 20%, #152d4d 0%, var(--tf-bg) 60%, var(--tf-bg-deep) 100%);
      font-family: var(--tf-font);
      color: var(--tf-text);
      touch-action: none;
      cursor: none;
    }

    #canvas-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    #magic-cursor {
      position: fixed;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(255, 214, 102, 0.7) 45%, rgba(255, 105, 180, 0) 70%);
      box-shadow: 0 0 16px 4px rgba(255, 215, 0, 0.8), 0 0 32px 8px rgba(255, 105, 180, 0.4);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.15s, height 0.15s, transform 0.05s;
    }

    #top-hud {
      position: fixed;
      top: max(12px, env(safe-area-inset-top, 12px));
      left: 14px;
      right: 14px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: auto;
    }

    .hud-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--tf-surface);
      border: 1.5px solid var(--tf-surface-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 8px 16px;
      border-radius: 999px;
      box-shadow: var(--tf-shadow);
    }

    .hud-logo-icon {
      font-size: 1.4rem;
      animation: spinBounce 4s ease-in-out infinite;
    }

    .hud-title {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #ffd700, #ff6b6b, #ff69b4, #38ef7d, #00d2ff);
      background-size: 250% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 4s linear infinite;
    }

    .hud-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-pill-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--tf-surface);
      border: 1.5px solid var(--tf-surface-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--tf-text);
      padding: 8px 14px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--tf-shadow);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      outline: none;
    }

    .hud-pill-button:hover {
      transform: translateY(-2px) scale(1.04);
      background: rgba(30, 60, 100, 0.85);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .smash-counter-pill {
      background: rgba(255, 182, 79, 0.15);
      border: 1.5px solid rgba(255, 182, 79, 0.4);
      color: var(--tf-accent);
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 0.95rem;
      backdrop-filter: blur(14px);
      box-shadow: 0 4px 16px rgba(255, 182, 79, 0.2);
    }

    .smash-counter-pill span {
      font-size: 1.2rem;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 182, 79, 0.8);
    }

    .theme-select {
      background: var(--tf-surface);
      border: 1.5px solid var(--tf-surface-border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 999px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.85rem;
      backdrop-filter: blur(14px);
      outline: none;
      cursor: pointer;
    }
    .theme-select option {
      background: #0b1d33;
      color: #fff;
    }

    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes spinBounce {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(18deg) scale(1.15); }
    }

    #popup-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 500;
      overflow: hidden;
    }

    .burst-letter {
      position: absolute;
      font-size: clamp(5.5rem, 18vw, 13rem);
      font-weight: 900;
      line-height: 1;
      text-align: center;
      transform: translate(-50%, -50%);
      will-change: transform, opacity;
      animation: popLetter 1.25s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
      filter: drop-shadow(0 14px 32px rgba(0, 0, 0, 0.65));
    }

    @keyframes popLetter {
      0% { transform: translate(-50%, -50%) scale(0.2) rotate(calc(var(--rot) * -1.5)); opacity: 0; }
      25% { transform: translate(-50%, -50%) scale(1.3) rotate(var(--rot)); opacity: 1; }
      70% { transform: translate(-50%, -50%) scale(1.05) rotate(calc(var(--rot) * 0.4)); opacity: 1; }
      100% { transform: translate(-50%, calc(-50% - 130px)) scale(0.65) rotate(calc(var(--rot) * 2)); opacity: 0; }
    }

    .burst-emoji {
      position: absolute;
      font-size: clamp(5rem, 16vw, 11rem);
      transform: translate(-50%, -50%);
      will-change: transform, opacity;
      animation: popEmoji 1.3s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
      filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.55));
    }

    @keyframes popEmoji {
      0% { transform: translate(-50%, -50%) scale(0) rotate(-35deg); opacity: 0; }
      30% { transform: translate(-50%, -50%) scale(1.4) rotate(15deg); opacity: 1; }
      75% { transform: translate(-50%, -50%) scale(1.1) rotate(-8deg); opacity: 1; }
      100% { transform: translate(-50%, calc(-50% - 140px)) scale(0.5) rotate(25deg); opacity: 0; }
    }

    .burst-photo-wrapper {
      position: absolute;
      transform: translate(-50%, -50%);
      will-change: transform, opacity;
      animation: popPhoto 2.2s cubic-bezier(0.18, 0.89, 0.32, 1.25) forwards;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .burst-photo-img {
      width: clamp(170px, 34vw, 300px);
      height: auto;
      max-height: clamp(190px, 38vw, 330px);
      object-fit: contain;
      filter: drop-shadow(0 0 24px rgba(255, 215, 0, 0.95))
              drop-shadow(0 0 40px rgba(255, 105, 180, 0.85))
              drop-shadow(0 16px 36px rgba(0, 0, 0, 0.7));
      animation: photoWiggle 1.8s ease-in-out infinite alternate;
    }

    .burst-photo-badge {
      margin-top: 8px;
      padding: 7px 20px;
      border-radius: 999px;
      color: #fff;
      font-size: clamp(0.95rem, 2.8vw, 1.3rem);
      font-weight: 900;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      border: 2px solid #ffffff;
      white-space: nowrap;
      animation: badgeBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popPhoto {
      0% { transform: translate(-50%, -50%) scale(0) rotate(-25deg); opacity: 0; }
      25% { transform: translate(-50%, -50%) scale(1.22) rotate(8deg); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.0) rotate(-4deg); opacity: 1; }
      80% { transform: translate(-50%, -50%) scale(1.0) rotate(2deg); opacity: 1; }
      100% { transform: translate(-50%, calc(-50% - 150px)) scale(0.6) rotate(-15deg); opacity: 0; }
    }

    @keyframes photoWiggle {
      0% { transform: rotate(-6deg) scale(0.98); }
      100% { transform: rotate(6deg) scale(1.02); }
    }

    @keyframes badgeBounce {
      0% { transform: scale(0); }
      80% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .shockwave {
      position: absolute;
      border-radius: 50%;
      border: 4px solid var(--ring-color, #ffd700);
      transform: translate(-50%, -50%) scale(0);
      animation: expandRing 0.85s ease-out forwards;
      pointer-events: none;
    }

    @keyframes expandRing {
      0% { transform: translate(-50%, -50%) scale(0.1); opacity: 1; border-width: 6px; }
      100% { transform: translate(-50%, -50%) scale(5.5); opacity: 0; border-width: 1px; }
    }

    .sparkle-star {
      position: absolute;
      font-size: clamp(1.4rem, 4vw, 2.6rem);
      pointer-events: none;
      animation: starFlight var(--dur, 0.9s) ease-out forwards;
    }

    @keyframes starFlight {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(360deg); opacity: 0; }
    }

    

    

    

    

    #bottom-hint {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 800;
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      font-weight: 700;
      color: var(--tf-muted);
      background: rgba(11, 29, 51, 0.65);
      padding: 8px 24px;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      letter-spacing: 0.5px;
      pointer-events: none;
      animation: pulseHint 2.5s ease-in-out infinite;
    }

    @keyframes pulseHint {
      0%, 100% { opacity: 0.5; transform: translateX(-50%) scale(0.98); }
      50% { opacity: 0.95; transform: translateX(-50%) scale(1.02); }
    }
  </style>
</head>
<body>

  <canvas id="canvas-stage"></canvas>
  <div id="magic-cursor"></div>

  <header id="top-hud">
    <div class="hud-brand">
      <span class="hud-logo-icon">🌟</span>
      <h1 class="hud-title">SubhAadar</h1>
    </div>

    <div class="hud-controls">
      <select id="theme-selector" class="theme-select" aria-label="Select Theme">
        <option value="magic">🌈 Rainbow Magic</option>
        <option value="family" selected>💖 Family & Photos</option>
        <option value="animals">🦁 Animals & Friends</option>
        <option value="letters">🔤 ABCs & 123s</option>
      </select>

      <button id="sound-btn" class="hud-pill-button" title="Toggle Sound">
        <span id="sound-icon">🔊</span>
        <span id="sound-text">Sound</span>
      </button>

      <button id="fullscreen-btn" class="hud-pill-button" title="Toggle Fullscreen">
        <span>⛶</span>
      </button>

      <div class="smash-counter-pill" title="Total Keys Smashed">
        Smashes: <span id="smash-count">0</span>
      </div>
    </div>
  </header>

  <main id="popup-layer"></main>



  <div id="bottom-hint">✨ Press any key or tap anywhere to play! ✨</div>

        palette: ['#FF1493','#FF8C00','#FFD700','#00FF7F','#00BFFF','#8A2BE2','#FF69B4']
      },
      family: {
        emojis: ['💖','🌟','🥰','👑','💝','💐','🎉','👶','👩','🐣','🧸','🧁','🍭','☀️','🌸'],
        palette: ['#FF416C','#FF4B2B','#FFD200','#00F2FE','#4FACFE','#FA709A','#FEE140']
      },
      animals: {
        emojis: ['🦁','🐯','🐼','🐨','🐶','🐱','🦊','🐸','🐵','🦄','🐬','🦜','🦚','🐰','🐘'],
        palette: ['#FF6B6B','#FFA502','#2ED573','#1E90FF','#3742FA','#FF4757','#70A1FF']
      },
      letters: {
        emojis: ['🍎','🍌','🚗','🚂','⚽','🏀','🎸','🎺','🔔','🎁','⏰','🍦','🍕','🎨','🎯'],
        palette: ['#FF4757','#FFA502','#2ED573','#1E90FF','#9B51E0','#E056FD','#686DE0']
      }
    };

    let currentTheme = 'family';
    let smashCount = 0;
    let isSoundEnabled = true;
    let lastX = window.innerWidth / 2;
    let lastY = window.innerHeight / 2;
    let photoIndex = 0;

    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    const PENTATONIC_FREQS = [
      261.63, 293.66, 329.63, 392.00, 440.00,
      523.25, 587.33, 659.25, 783.99, 880.00,
      1046.50, 1174.66, 1318.51, 1567.98
    ];

    function playMarimbaNote(freq) {
      if (!isSoundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq || PENTATONIC_FREQS[Math.floor(Math.random() * PENTATONIC_FREQS.length)], ctx.currentTime);
        gain.gain.setValueAtTime(0.001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.65);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.7);
      } catch (e) {}
    }

    function playCelebrationChime() {
      if (!isSoundEnabled) return;
      [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((note, i) => {
        setTimeout(() => playMarimbaNote(note), i * 110);
      });
    }

    const canvas = document.getElementById('canvas-stage');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let ambientBubbles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 22; i++) {
      ambientBubbles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        radius: Math.random() * 45 + 15,
        dx: (Math.random() - 0.5) * 0.8,
        dy: (Math.random() - 0.5) * 0.8,
        hue: Math.floor(Math.random() * 360),
        alpha: Math.random() * 0.08 + 0.03
      });
    }

    function animateStage() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ambientBubbles.forEach(b => {
        b.x += b.dx;
        b.y += b.dy;
        if (b.x < -50) b.x = canvas.width + 50;
        if (b.x > canvas.width + 50) b.x = -50;
        if (b.y < -50) b.y = canvas.height + 50;
        if (b.y > canvas.height + 50) b.y = -50;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${b.hue}, 85%, 65%, ${b.alpha})`;
        ctx.fill();
      });

      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fill();
        ctx.globalAlpha = 1;
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity || 0;
        p.life -= p.decay;
      });
      requestAnimationFrame(animateStage);
    }
    requestAnimationFrame(animateStage);

    function spawnParticles(x, y, count = 16) {
      const palette = THEMES[currentTheme].palette;
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 7 + 2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          gravity: 0.18,
          size: Math.random() * 6 + 3,
          color: palette[Math.floor(Math.random() * palette.length)],
          life: 1.0,
          decay: Math.random() * 0.03 + 0.02
        });
      }
    }

    const cursor = document.getElementById('magic-cursor');
    document.addEventListener('mousemove', e => {
      lastX = e.clientX;
      lastY = e.clientY;
      cursor.style.left = lastX + 'px';
      cursor.style.top = lastY + 'px';
      if (Math.random() < 0.6) {
        particles.push({
          x: lastX + (Math.random() - 0.5) * 10,
          y: lastY + (Math.random() - 0.5) * 10,
          vx: (Math.random() - 0.5) * 1.5,
          vy: (Math.random() - 0.5) * 1.5 - 0.5,
          gravity: 0.04,
          size: Math.random() * 4 + 2,
          color: `hsl(${(Date.now() / 8) % 360}, 100%, 70%)`,
          life: 0.8,
          decay: 0.04
        });
      }
    });

    const popupLayer = document.getElementById('popup-layer');

    function spawnShockwave(x, y, color) {
      const ring = document.createElement('div');
      ring.className = 'shockwave';
      ring.style.left = x + 'px';
      ring.style.top = y + 'px';
      ring.style.setProperty('--ring-color', color || '#ffd700');
      popupLayer.appendChild(ring);
      setTimeout(() => ring.remove(), 900);
    }

    function spawnFlyingStars(x, y, count = 8) {
      const stars = ['⭐','✨','💫','🌟','💖','🎉'];
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'sparkle-star';
        el.textContent = stars[Math.floor(Math.random() * stars.length)];
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
        const dist = Math.random() * 110 + 60;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
        el.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
        el.style.setProperty('--dur', (Math.random() * 0.4 + 0.6) + 's');
        popupLayer.appendChild(el);
        setTimeout(() => el.remove(), 1000);
      }
    }

    function spawnLetter(char, x, y) {
      const palette = THEMES[currentTheme].palette;
      const color = palette[Math.floor(Math.random() * palette.length)];
      const el = document.createElement('div');
      el.className = 'burst-letter';
      el.textContent = char.toUpperCase();
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.color = color;
      el.style.setProperty('--rot', ((Math.random() - 0.5) * 40) + 'deg');
      el.style.textShadow = `0 0 28px ${color}, 0 8px 30px rgba(0,0,0,0.7)`;
      popupLayer.appendChild(el);
      setTimeout(() => el.remove(), 1300);
    }

    function spawnEmoji(x, y) {
      const theme = THEMES[currentTheme];
      const emoji = theme.emojis[Math.floor(Math.random() * theme.emojis.length)];
      const el = document.createElement('div');
      el.className = 'burst-emoji';
      el.textContent = emoji;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      popupLayer.appendChild(el);
      setTimeout(() => el.remove(), 1400);
    }

    function spawnPhoto(x, y) {
      const photoData = CUTOUT_PHOTOS[photoIndex % CUTOUT_PHOTOS.length];
      photoIndex++;

      const wrapper = document.createElement('div');
      wrapper.className = 'burst-photo-wrapper';
      wrapper.style.left = x + 'px';
      wrapper.style.top = y + 'px';

      const img = document.createElement('img');
      img.className = 'burst-photo-img';
      img.src = photoData.src;
      img.alt = photoData.title;

      const badge = document.createElement('div');
      badge.className = 'burst-photo-badge';
      badge.textContent = photoData.title;
      badge.style.background = `linear-gradient(135deg, ${photoData.color}, #ffd700)`;

      wrapper.appendChild(img);
      wrapper.appendChild(badge);
      popupLayer.appendChild(wrapper);

      playCelebrationChime();
      spawnFlyingStars(x, y, 12);
      spawnParticles(x, y, 28);
      setTimeout(() => wrapper.remove(), 2300);
    }

    /* Generates random coordinates anywhere on screen */
    function getRandomScreenCoords() {
      const marginX = Math.min(150, window.innerWidth * 0.18);
      const marginTop = 100; // clear the top HUD
      const marginBottom = 90;
      
      const x = Math.random() * (window.innerWidth - 2 * marginX) + marginX;
      const y = Math.random() * (window.innerHeight - marginTop - marginBottom) + marginTop;
      return { x, y };
    }

    /* Main Trigger: Exactly ONE popup per click/press, scattered anywhere on screen */
    function triggerAction(char) {
      // Pick random location across the whole screen on every click/touch
      const { x, y } = getRandomScreenCoords();

      smashCount++;
      document.getElementById('smash-count').textContent = smashCount;

      const noteFreq = PENTATONIC_FREQS[Math.floor(Math.random() * PENTATONIC_FREQS.length)];
      playMarimbaNote(noteFreq);

      const palette = THEMES[currentTheme].palette;
      const randomColor = palette[Math.floor(Math.random() * palette.length)];
      spawnShockwave(x, y, randomColor);
      spawnParticles(x, y, 16);
      spawnFlyingStars(x, y, 6);

      // Random chance for Photo cutout (~30%), else Letter (if pressed) or Emoji
      const photoChance = currentTheme === 'family' ? 0.35 : 0.22;
      const roll = Math.random();

      if (roll < photoChance) {
        spawnPhoto(x, y);
      } else if (char && char.length === 1 && /[a-zA-Z0-9]/.test(char)) {
        spawnLetter(char, x, y);
      } else {
        if (Math.random() < 0.5) {
          spawnEmoji(x, y);
        } else {
          const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('');
          spawnLetter(letters[Math.floor(Math.random() * letters.length)], x, y);
        }
      }

      
    }

    = getRandomScreenCoords();
          spawnPhoto(x, y);
        }, i * 280);
      }

      setTimeout(() => {
        milestoneBanner.classList.remove('show');
      }, 2600);
    }

    // Keyboard event listener (press any key -> pop anywhere on screen)
    document.addEventListener('keydown', e => {
      if (!['F5', 'F11', 'F12'].includes(e.key) && !e.ctrlKey && !e.metaKey) {
        e.preventDefault();
      }
      triggerAction(e.key.length === 1 ? e.key : null);
    });

    // Mouse / Pointer click listener (click anywhere -> pop anywhere on screen)
    document.addEventListener('pointerdown', e => {
      if (e.target.closest('#top-hud')) return;
      triggerAction(null);
    });

    // Touch listener for mobile & tablets (multi-touch supported)
    document.addEventListener('touchstart', e => {
      if (e.target.closest('#top-hud')) return;
      e.preventDefault();
      Array.from(e.changedTouches).forEach(() => {
        triggerAction(null);
      });
    }, { passive: false });

    // HUD controls
    const themeSelect = document.getElementById('theme-selector');
    themeSelect.addEventListener('change', e => {
      currentTheme = e.target.value;
      triggerAction(null);
    });

    const soundBtn = document.getElementById('sound-btn');
    const soundIcon = document.getElementById('sound-icon');
    const soundText = document.getElementById('sound-text');
    soundBtn.addEventListener('click', () => {
      isSoundEnabled = !isSoundEnabled;
      soundIcon.textContent = isSoundEnabled ? '🔊' : '🔇';
      soundText.textContent = isSoundEnabled ? 'Sound' : 'Muted';
      if (isSoundEnabled) playMarimbaNote(659.25);
    });

    const fsBtn = document.getElementById('fullscreen-btn');
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      }
    });

    // Idle attract animation after 3.5s
    let idleTimer = null;
    function startIdleTimer() {
      clearInterval(idleTimer);
      idleTimer = setInterval(() => {
        triggerAction(null);
      }, 3500);
    }

    ['keydown', 'touchstart', 'pointerdown', 'mousemove'].forEach(evt => {
      document.addEventListener(evt, () => {
        clearInterval(idleTimer);
        setTimeout(startIdleTimer, 4000);
      }, { passive: true });
    });

    startIdleTimer();
  </script>
